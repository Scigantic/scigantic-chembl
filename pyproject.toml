[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-chembl"
version = "0.1.1"
description = "Query ChEMBL directly from a public S3 mirror with DuckDB, including a pre-joined potency table and fingerprint similarity search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic" }]
keywords = ["chembl", "cheminformatics", "duckdb", "drug-discovery", "bioactivity"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "duckdb>=0.10",
  "pyarrow>=14",
  "numpy>=2.0",
  "pandas>=1.5",
]

[project.optional-dependencies]
# rdkit is only needed to encode the query molecule in similar_compounds();
# everything else works without it.
similarity = ["rdkit>=2023.9"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-chembl"
Issues = "https://github.com/Scigantic/scigantic-chembl/issues"

[project.scripts]
scigantic-chembl = "scigantic_chembl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_chembl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
