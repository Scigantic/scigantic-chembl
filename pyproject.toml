[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-chembl"
version = "0.4.5"
description = "Query ChEMBL directly from a public S3 mirror with DuckDB, including a pre-joined potency table, similarity search, and substructure search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic" }]
keywords = ["chembl", "cheminformatics", "duckdb", "drug-discovery", "bioactivity"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "duckdb>=0.10,<2",
  "pyarrow>=14,<26",
  "numpy>=2.0,<3",
  "pandas>=1.5,<4",
]

[project.optional-dependencies]
# rdkit is only needed to encode the query molecule in similar_compounds();
# everything else works without it.
similarity = ["rdkit>=2023.9"]
dev = ["pytest>=7", "pytest-cov>=5", "mypy>=1.10", "pandas-stubs"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-chembl"
Issues = "https://github.com/Scigantic/scigantic-chembl/issues"

[project.scripts]
scigantic-chembl = "scigantic_chembl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_chembl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scigantic_chembl"]
# Not wired into CI as a gate: this suite runs real queries against the live
# S3 mirror, so a coverage threshold would be one more thing that can fail
# for reasons unrelated to a change. `pytest --cov` is available locally for
# anyone who wants the number.

[tool.mypy]
# No python_version pin: numpy's own .pyi stubs use syntax (PEP 695 `type`
# statements) that needs a modern parser regardless of our own 3.10 floor,
# so this checks with whatever interpreter runs mypy rather than forcing an
# older grammar that chokes on a dependency's stub files.
strict = true

# pyarrow ships without a py.typed marker on this version; nothing to fix on
# our side, so this is scoped to that one module rather than a blanket
# ignore_missing_imports that would also hide a real gap elsewhere.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
