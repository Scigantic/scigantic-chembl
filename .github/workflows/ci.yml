name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # duckdb, pyarrow, numpy and rdkit all ship 3.14 wheels already;
        # keeping it in the matrix is what proves that stays true.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install + test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,similarity]"
          pytest -q
